distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方地址。中国大陆常常连不上或极慢（表现为卡在 "Downloading ..." 不动），
# 此时把下面这行换成一个镜像即可，其余不用动：
#   腾讯云： https\://mirrors.cloud.tencent.com/gradle/gradle-8.6-bin.zip
#   阿里云： https\://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.6-bin.zip
# 或者本机已经装好 Gradle 8.6 的话，直接用它构建，不走 wrapper：
#   gradle assembleDebug
distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
